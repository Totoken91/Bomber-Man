<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keni Boum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby-screen" class="screen active">
    <h1>KENI BOUM</h1>
    <div class="lobby-container">
      <div class="name-input">
        <input type="text" id="player-name" placeholder="Ton pseudo..." maxlength="15">
      </div>
      <h2>Choisis ton perso</h2>
      <div id="skin-selector" class="skin-grid"></div>
      <div class="lobby-actions">
        <button id="btn-create">Créer une salle</button>
      </div>
      <div class="rooms-list">
        <h2>Salles disponibles</h2>
        <div id="rooms-container">
          <p class="no-rooms">Aucune salle disponible</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Waiting Room -->
  <div id="waiting-screen" class="screen">
    <h1>KENI BOUM</h1>
    <div class="waiting-container">
      <h2>Salle d'attente</h2>
      <div id="players-list"></div>
      <div id="host-options" style="display:none">
        <div class="option-group">
          <h3>Taille</h3>
          <div class="option-row">
            <button class="opt-btn map-size-btn" data-size="small">Petite<br><span>11x9</span></button>
            <button class="opt-btn map-size-btn active" data-size="normal">Normale<br><span>15x13</span></button>
            <button class="opt-btn map-size-btn" data-size="large">Grande<br><span>19x15</span></button>
          </div>
        </div>
        <div class="option-group">
          <h3>Thème</h3>
          <div class="option-row" id="theme-selector">
            <button class="opt-btn theme-btn active" data-theme="dungeon">Donjon</button>
            <button class="opt-btn theme-btn" data-theme="fortress">Forteresse</button>
            <button class="opt-btn theme-btn" data-theme="crypt">Crypte</button>
          </div>
        </div>
        <div class="option-group">
          <h3>Layout</h3>
          <div class="option-row" id="layout-selector">
            <button class="opt-btn layout-btn active" data-layout="classic">Classique</button>
            <button class="opt-btn layout-btn" data-layout="arena">Arène</button>
            <button class="opt-btn layout-btn" data-layout="corridors">Couloirs</button>
            <button class="opt-btn layout-btn" data-layout="maze">Labyrinthe</button>
          </div>
        </div>
      </div>
      <div class="waiting-actions">
        <button id="btn-start" style="display:none">Lancer la partie</button>
        <button id="btn-leave">Quitter la salle</button>
      </div>
      <p id="waiting-info">En attente de joueurs...</p>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>
    <div id="game-hud">
      <div id="hud-info"></div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameover-overlay" class="overlay">
    <div class="overlay-content">
      <h2 id="gameover-text">Game Over</h2>
      <button id="btn-back-lobby">Retour au lobby</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/input.js"></script>
  <script src="js/spriteLoader.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/network.js"></script>
  <script src="js/gameState.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
